<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی تیراندازی سه‌بعدی</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 18px;
            text-shadow: 0 0 10px #00ff00;
            font-weight: bold;
            z-index: 100;
            font-family: 'Courier New', monospace;
            direction: rtl;
        }
        
        #score, #ammo, #health, #fps {
            margin: 10px 0;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 0 10px #00ff00;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: #00ff00;
        }
        
        #crosshair::before {
            width: 2px;
            height: 8px;
            left: 50%;
            top: -10px;
            transform: translateX(-50%);
        }
        
        #crosshair::after {
            width: 8px;
            height: 2px;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff00;
            text-align: left;
            direction: rtl;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 40px;
            border: 3px solid #ff0000;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
            display: none;
            font-size: 24px;
            text-shadow: 0 0 20px #ff0000;
            direction: rtl;
        }
        
        #game-over h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff0000;
        }
        
        #game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        
        #game-over button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div id="score">امتیاز: 0</div>
        <div id="ammo">فشنگ: ∞</div>
        <div id="health">سلامتی: 100</div>
        <div id="fps">FPS: 0</div>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="instructions">
        <strong>🎮 کنترل‌ها:</strong><br>
        W - رو به جلو<br>
        A - چپ | D - راست<br>
        Space - پریدن<br>
        ماوس - نگاه کردن<br>
        کلیک چپ - شلیک<br>
        R - شارژ کردن
    </div>
    
    <div id="game-over">
        <h1>☠️ گیم اور!</h1>
        <div id="final-score">امتیاز نهایی: 0</div>
        <button onclick="location.reload()">بازی دوباره</button>
    </div>

    <script>
        // صحنه Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 100, 1000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, precision: 'highp' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // روشنایی
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 200;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);
        
        // زمین
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x2d3436 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // دیوارها
        const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x636e72 });
        
        function createWall(x, y, z, width, height, depth) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMaterial);
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            return wall;
        }
        
        createWall(0, 5, -50, 100, 10, 5);
        createWall(-50, 5, 0, 5, 10, 100);
        createWall(50, 5, 0, 5, 10, 100);
        
        // دشمنان
        const enemies = [];
        
        function createEnemy(x, z) {
            const group = new THREE.Group();
            
            // بدن
            const bodyGeometry = new THREE.ConeGeometry(0.8, 2.5, 32);
            const bodyMaterial = new THREE.MeshLambertMaterial({ 
                color: Math.random() > 0.5 ? 0xff3333 : 0xff6666
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.25;
            body.castShadow = true;
            group.add(body);
            
            // سر
            const headGeometry = new THREE.SphereGeometry(0.6, 32, 32);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xff4444 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 3;
            head.castShadow = true;
            group.add(head);
            
            // چشم‌ها
            const eyeGeometry = new THREE.SphereGeometry(0.15, 16, 16);
            const eyeMaterial = new THREE.MeshLambertMaterial({ color: 0xffff00 });
            
            const eye1 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye1.position.set(-0.25, 3.3, 0.5);
            group.add(eye1);
            
            const eye2 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye2.position.set(0.25, 3.3, 0.5);
            group.add(eye2);
            
            group.position.set(x, 0, z);
            scene.add(group);
            
            return {
                group: group,
                health: 100,
                speed: 0.05,
                shootTimer: 0,
                lastShootTime: 0
            };
        }
        
        // ایجاد دشمنان اولیه
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const radius = 30;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            enemies.push(createEnemy(x, z));
        }
        
        // کنترل
        const keys = {};
        const mouse = { x: 0, y: 0 };
        
        window.addEventListener('keydown', (e) => {
            keys[e.key.toUpperCase()] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key.toUpperCase()] = false;
        });
        
        document.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        
        // شلیک
        let score = 0;
        let health = 100;
        const projectiles = [];
        
        document.addEventListener('click', () => {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(mouse.x, mouse.y), camera);
            
            const hits = raycaster.intersectObjects(enemies.map(e => e.group), true);
            
            if (hits.length > 0) {
                let targetEnemy = null;
                for (let enemy of enemies) {
                    if (enemy.group.children.some(child => hits[0].object === child || hits[0].object.parent === child)) {
                        targetEnemy = enemy;
                        break;
                    }
                }
                
                if (targetEnemy) {
                    targetEnemy.health -= 50;
                    score += 10;
                    document.getElementById('score').textContent = `امتیاز: ${score}`;
                    
                    if (targetEnemy.health <= 0) {
                        scene.remove(targetEnemy.group);
                        enemies.splice(enemies.indexOf(targetEnemy), 1);
                        score += 100;
                        document.getElementById('score').textContent = `امتیاز: ${score}`;
                        
                        // اضافه کردن دشمن جدید
                        if (enemies.length < 15) {
                            const angle = Math.random() * Math.PI * 2;
                            const radius = 40;
                            const x = Math.cos(angle) * radius;
                            const z = Math.sin(angle) * radius;
                            enemies.push(createEnemy(x, z));
                        }
                    }
                }
            }
        });
        
        // حرکت دوربین
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;
        
        function updateCamera() {
            euler.setFromQuaternion(camera.quaternion);
            euler.rotateY(-mouse.x * 0.005);
            euler.rotateX(-mouse.y * 0.005);
            euler.order = 'YXZ';
            euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
            camera.quaternion.setFromEuler(euler);
        }
        
        // حرکت بازیکن
        function updatePlayer() {
            const moveDir = new THREE.Vector3();
            const forward = new THREE.Vector3();
            const right = new THREE.Vector3();
            
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            
            right.crossVectors(camera.up, forward);
            right.normalize();
            
            if (keys['W']) moveDir.addScaledVector(forward, 0.2);
            if (keys['S']) moveDir.addScaledVector(forward, -0.2);
            if (keys['D']) moveDir.addScaledVector(right, 0.2);
            if (keys['A']) moveDir.addScaledVector(right, -0.2);
            
            camera.position.add(moveDir);
            
            // حدود
            camera.position.x = Math.max(-95, Math.min(95, camera.position.x));
            camera.position.z = Math.max(-95, Math.min(95, camera.position.z));
        }
        
        // حرکت دشمنان و شلیک
        function updateEnemies() {
            const now = Date.now();
            
            enemies.forEach((enemy, index) => {
                const direction = camera.position.clone().sub(enemy.group.position);
                const distance = direction.length();
                
                if (distance > 1) {
                    direction.normalize();
                    enemy.group.position.addScaledVector(direction, enemy.speed);
                }
                
                enemy.group.lookAt(camera.position);
                
                if (distance < 50 && now - enemy.lastShootTime > 1000) {
                    health -= 10;
                    document.getElementById('health').textContent = `سلامتی: ${health}`;
                    enemy.lastShootTime = now;
                    
                    if (health <= 0) {
                        gameOver();
                    }
                }
            });
        }
        
        // نمایش FPS
        let lastTime = performance.now();
        let frameCount = 0;
        
        function updateFPS() {
            const currentTime = performance.now();
            frameCount++;
            
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = currentTime;
            }
        }
        
        function gameOver() {
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').textContent = `امتیاز نهایی: ${score}`;
            cancelAnimationFrame(animationId);
        }
        
        // حلقه انیمیشن
        let animationId;
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            updateCamera();
            updatePlayer();
            updateEnemies();
            updateFPS();
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // تنظیم سایز صفحه
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // قفل ماوس
        document.addEventListener('click', () => {
            document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
            document.body.requestPointerLock();
        });
    </script>
</body>
</html>
